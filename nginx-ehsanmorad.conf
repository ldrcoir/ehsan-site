# ============================================================================
# nginx-ehsanmorad.conf — تنظیمات Nginx برای ۳ دامنه — v1.1.1
# ============================================================================
# این فایل رو به /etc/nginx/sites-available/ کپی کن
# و یه symlink به /etc/nginx/sites-enabled/ بساز
#
# دستورات:
#   sudo cp nginx-ehsanmorad.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/nginx-ehsanmorad.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# v1.1.1 (audit S10-L7/M1):
#   - proxy_pass به 127.0.0.1 صریح (localhost می‌تواند ::1 را امتحان کند و وقتی
#     app فقط روی 127.0.0.1 bind شده، 502 بدهد)
#   - client_max_body_size 1m صریح — باید با محدودیت 1MB خودِ app هم‌خوان باشد
#     (قبلاً به پیش‌فرضِ coincidental تکیه می‌کرد)
#   - هدر Connection فقط برای websocket واقعی (قبلاً unconditional "upgrade")
#   - proxy_read_timeout 120s برای پاسخ‌های طولانی چت AI
#   - TLS بعد از certbot --nginx به‌صورت خودکار به این فایل اضافه می‌شود
#     (install.sh حالا با --redirect اجرا می‌کند)
# ============================================================================

# map — هدر Connection فقط برای upgrade واقعی
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# v1.0 (audit W46-50 #10): server_tokens off + zone های limit_req — این فایل در
# http context include می‌شود پس این directiveها آنجا معتبرند
server_tokens off;

# rate limit nginx-سطح برای دو مسیر حساس (app خودش هم limiter دارد؛ این لایه‌ی
# edge است که قبل از رسیدن به node سربار را می‌گیرد)
limit_req_zone $binary_remote_addr zone=login_zone:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=maint_zone:1m rate=10r/m;

# v1.0 (audit W46-50 #10): catch-all — اسکن IP مستقیم / Host جعلی دیگر به
# اولین server block نمی‌خورد و بسته می‌شود
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# دامنه ۱: ehsanmorad.ir
server {
    listen 80;
    server_name ehsanmorad.ir www.ehsanmorad.ir;

    client_max_body_size 1m;

    # v1.0: edge rate limit برای login (در هر ۳ دامنه)
    location /api/user/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # v1.0: edge rate limit برای کانال نگهداری
    location /api/maintenance {
        limit_req zone=maint_zone burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

