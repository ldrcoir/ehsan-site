# ============================================================================
# nginx-ehsanmorad.conf — تنظیمات Nginx برای ۳ دامنه
# ============================================================================
# این فایل رو به /etc/nginx/sites-available/ کپی کن
# و یه symlink به /etc/nginx/sites-enabled/ بساز
#
# دستورات:
#   sudo cp nginx-ehsanmorad.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/nginx-ehsanmorad.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
# ============================================================================

# دامنه ۱: ehsanmorad.ir
server {
    listen 80;
    server_name ehsanmorad.ir www.ehsanmorad.ir;
    
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

