# ============================================================================
# nginx-ehsanmorad.conf — تنظیمات Nginx برای ۳ دامنه — v1.1.1
# ============================================================================
# این فایل رو به /etc/nginx/sites-available/ کپی کن
# و یه symlink به /etc/nginx/sites-enabled/ بساز
#
# دستورات:
#   sudo cp nginx-ehsanmorad.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/nginx-ehsanmorad.conf /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# v1.1.1 (audit S10-L7/M1):
#   - proxy_pass به 127.0.0.1 صریح (localhost می‌تواند ::1 را امتحان کند و وقتی
#     app فقط روی 127.0.0.1 bind شده، 502 بدهد)
#   - client_max_body_size 1m صریح — باید با محدودیت 1MB خودِ app هم‌خوان باشد
#     (قبلاً به پیش‌فرضِ coincidental تکیه می‌کرد)
#   - هدر Connection فقط برای websocket واقعی (قبلاً unconditional "upgrade")
#   - proxy_read_timeout 120s برای پاسخ‌های طولانی چت AI
#   - TLS بعد از certbot --nginx به‌صورت خودکار به این فایل اضافه می‌شود
#     (install.sh حالا با --redirect اجرا می‌کند)
# ============================================================================

# map — هدر Connection فقط برای upgrade واقعی
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# دامنه ۱: ehsanmorad.ir
server {
    listen 80;
    server_name ehsanmorad.ir www.ehsanmorad.ir;

    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

