# ============================================================================
# docker-compose.yml — Personal Site + Caddy (با دامنه، نه پورت)
# ============================================================================
# سایت روی پورت ۳۰۰۰ داخل container اجرا می‌شه
# Caddy روی پورت ۸۰/۴۴۳ دامنه‌ها رو به سایت وصل می‌کنه
# کاربر فقط https://ehsanmorad.ir رو می‌بینه — بدون پورت
# ============================================================================

services:
  personal-site:
    build: .
    container_name: personal-site
    # پورت ۳۰۰۰ فقط روی localhost (نه بیرون)
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./db:/app/db
    environment:
      - DATABASE_URL=file:/app/db/custom.db
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - personal-site
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
