# ============================================================================
# docker-compose.yml — فقط سایت (بدون Caddy، بدون تداخل با Nginx)
# ============================================================================
# سایت روی پورت 3000 اجرا می‌شه
# شما خودت با Nginx یا Caddy (که نصبه) دامنه‌ها رو به پورت 3000 وصل کن
# ============================================================================

services:
  personal-site:
    build: .
    container_name: personal-site
    ports:
      - "3000:3000"
    volumes:
      - ./db:/app/db
    environment:
      - DATABASE_URL=file:/app/db/custom.db
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
