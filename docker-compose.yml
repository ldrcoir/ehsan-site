# ============================================================================
# docker-compose.yml — Personal Site (اصلاح شده)
# ============================================================================
# نکته: این فایل باید توی همون پوشه‌ای باشه که Dockerfile هست
# ============================================================================

services:
  personal-site:
    build: .
    container_name: personal-site
    ports:
      - "3000:3000"
    volumes:
      - ./db:/app/db
    environment:
      - DATABASE_URL=file:/app/db/custom.db
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
