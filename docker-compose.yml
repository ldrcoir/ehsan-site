version: "3.8"
services:
  website:
    build: .
    container_name: personal-site
    ports:
      - "3000:3000"
    volumes:
      - site-db:/app/db
    environment:
      - NODE_ENV=development
      - DATABASE_URL=file:/app/db/custom.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
volumes:
  site-db:
